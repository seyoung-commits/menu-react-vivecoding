# 1. Spring config
spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  # 1-1. db config
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/menudb}
    username: ${DB_USERNAME:ohgiraffers}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  # 1-2. jpa config
  jpa:
    generate-ddl: false
    database: mysql
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
        use_sql_comments: true
  # 1-3. jackson config
  jackson:
    deserialization:
      fail-on-null-for-primitives: false
  # 1-4. paging config
  data:
    web:
      pageable:
        one-indexed-parameters: true

# -------------------------------------------------------------------------------------------------
# spring.data.web.pageable.one-indexed-parameters:
# Pageable의 페이지 번호는 원래 0부터 시작하지만, 화면에는 1페이지부터 보여주는 것이 자연스럽다.
# 이 설정을 true로 두면 요청의 page 파라미터를 1부터 세는 값으로 해석해준다.
# (즉, ?page=1 요청이 내부적으로는 0번 인덱스로 변환되어 넘어온다)
# -------------------------------------------------------------------------------------------------
# 이 변환은 요청 파라미터를 Pageable 객체로 만들어주는 시점에 일어난다.
# 즉 '페이지 번호를 몇 번부터 세는가'는 화면과의 약속이므로 표현 계층에서 처리하고,
# 서비스 계층은 Spring Data의 표준인 0부터 시작하는 Pageable을 그대로 받게 된다.
# 서비스에서 page - 1 같은 보정을 직접 하면 화면 규칙이 비즈니스 로직에 섞이고,
# 페이징 API를 새로 추가할 때마다 보정을 빠뜨리는 실수가 생기기 쉽다.
# -------------------------------------------------------------------------------------------------
# 주의. 이 설정은 '요청'의 page 파라미터에만 적용된다.
#      응답으로 내려주는 Page.getNumber()는 여전히 0부터 시작하므로,
#      화면에도 1부터 보여주려면 컨트롤러에서 +1 처리를 해주어야 한다. (아래 MenuController 참고)
# -------------------------------------------------------------------------------------------------

# -------------------------------------------------------------------------------------------------
# spring.jackson.deserialization.fail-on-null-for-primitives:
# Spring Boot 4.x는 Jackson 3을 사용하며, Jackson 2와 기본값이 하나 달라졌다.
# - Jackson 2: JSON에 없거나 null인 값을 int 같은 기본형에 넣을 때 그냥 0으로 처리했다.
# - Jackson 3: 같은 상황에서 에러를 낸다(FAIL_ON_NULL_FOR_PRIMITIVES 기본값이 뒤집힘).
# 그래서 MenuDTO에 'private int menuCode'가 있는데 등록 요청 JSON에 menuCode를 빼고 보내면
# 역직렬화 단계에서 "Cannot map `null` into type `int`" 오류와 함께 400이 나버린다.
# (신규 등록 요청처럼 menuCode를 보낼 이유가 없는 경우가 여기 해당한다)
# 아래 설정으로 Jackson 2와 동일하게 '없으면 0' 으로 처리하도록 되돌린다.
# (04_spring_boot의 chap09에서 다룬 것과 같은 설정이다)
# -------------------------------------------------------------------------------------------------

# -------------------------------------------------------------------------------------------------
# spring.jpa.database:
# 사용할 DBMS 종류를 지정한다. Hibernate가 이 값을 보고 알맞은 방언(Dialect)을 선택한다.
# 방언이란 표준 SQL과 다른 각 DBMS만의 문법 차이(페이징 구문, 자동 증가 키 처리 방식 등)를 말하며,
# JPA는 이 방언 덕분에 같은 JPQL로 여러 DBMS를 지원할 수 있다.
# database-platform으로 방언 클래스를 직접 지정할 수도 있지만,
# 보통은 위처럼 종류만 알려주고 세부 선택은 Hibernate에 맡기는 편이다.
# -------------------------------------------------------------------------------------------------
# spring.jpa.properties.hibernate.use_sql_comments:
# Hibernate가 생성하는 SQL 쿼리에 주석을 추가하여 해당 쿼리의 생성 원인(JPQL, Criteria 등)을 알려준다.
# JPA의 자동 쿼리 생성 특성상, 실제 실행된 SQL이 소스코드의 어느 부분에서 기인했는지 분석할 때 매우 유용하다.
# -------------------------------------------------------------------------------------------------
# 주요 주석 종류:
# /* load 엔티티명 */: 단일 엔티티 조회 (find, getReference 등)
# /* <JPQL/HQL 문장> */: 작성한 JPQL/HQL 구문이 그대로 주석으로 표현됨 (ex: /* from Menu m */)
# /* <criteria> */: Criteria API를 통해 동적으로 생성된 쿼리
# /* native SQL */: 네이티브 SQL(Native Query)을 직접 사용하여 작성된 쿼리
# /* NamedQuery: 쿼리명 */: 엔티티에 정의된 @NamedQuery를 통해 실행된 쿼리
# /* collection fetch: 엔티티.필드 */: @OneToMany 등 컬렉션 페칭(Fetch Join 포함) 시 생성된 쿼리
# /* subselect */: 서브쿼리를 사용해 컬렉션을 로딩할 때 생성된 쿼리
# /* insert/update/delete 엔티티명 */: 해당 엔티티에 대한 DML(데이터 조작) 쿼리
# /* batch insert/update 엔티티명 */: JDBC 배치 설정을 통해 묶음으로 실행되는 쿼리
# -------------------------------------------------------------------------------------------------

# 2. logging config
logging:
  level:
    # 실행되는 SQL 출력
    org.hibernate.SQL: debug
    # 바인딩되는 파라미터 출력
    org.hibernate.orm.jdbc.bind: trace

# -------------------------------------------------------------------------------------------------
# logging.level.org.hibernate.orm.jdbc.bind:
# PreparedStatement내 ?(place holder)에 실제 런타임 시 어떤 값이 바인딩 되는지 로그를 작성해주는 설정
# -------------------------------------------------------------------------------------------------
# Logging Level (위로 갈수록 높은 레벨):
# 0. [OFF] - 로깅 비활성화 (가장 높은 레벨)
# 1. [ERROR] - 심각한 문제 : 애플리케이션이 정상 동작할 수 없는 경우
# 2. [WARN] - 경고 : 주의가 필요한 상황이나 향후 문제가 발생할 가능성
# 3. [INFO] - 일반적인 정보 : 애플리케이션의 정상적인 동작 흐름 (Spring Boot의 기본 레벨)
# 4. [DEBUG] - 디버깅을 위한 상세 정보 : 개발 중에 주로 사용
# 5. [TRACE] - 매우 상세한 디버깅 정보 : 거의 모든 동작을 추적 (가장 낮은 레벨)
#
# 설정한 레벨보다 '높은' 레벨의 로그까지 함께 출력된다.
# (예: DEBUG로 설정하면 DEBUG, INFO, WARN, ERROR가 모두 출력된다)
#
# 참고. FATAL 레벨은 Log4j2 등 일부 로깅 프레임워크에만 존재한다.
#       Spring Boot의 기본 로깅 구현체인 Logback에는 FATAL이 없으며 ERROR로 처리된다.
# -------------------------------------------------------------------------------------------------

# 3. server config
server:
  port: 8080

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true
    operations-sorter: method

# 업로드 파일은 빌드 폴더 밖에 보관한다. 배포 시 MENU_UPLOAD_DIR로 영구 저장 경로를 지정한다.
app:
  upload-dir: ${MENU_UPLOAD_DIR:./uploads/menu-images}

# 카카오페이 단건 테스트 결제. 비밀 키는 실행 환경변수에서 읽는다.
kakaopay:
  cid: TC0ONETIME
  secret-key: ${KAKAOPAY_SECRET_KEY:}

# 카카오 로그인
kakao:
  rest-api-key: ${KAKAO_REST_API_KEY:}
  client-secret: ${KAKAO_CLIENT_SECRET:}
  redirect-uri: http://localhost:8080/api/auth/kakao/callback
  frontend-base-url: http://localhost:5173
  # 개발자센터 테스트 앱의 간편가입과 약관을 설정한 뒤 true로 전환한다.
  sync-enabled: ${KAKAO_SYNC_ENABLED:false}
  sync-required-terms: ${KAKAO_SYNC_REQUIRED_TERMS:menu_terms_20261005}


# AI 기능. API 키는 서버의 환경변수에서만 읽는다.
openai:
  api-key: ${OPENAI_API_KEY:}
  base-url: https://api.openai.com/v1
  model:
    extract: ${OPENAI_TEXT_MODEL:gpt-6-luna}
    chat: ${OPENAI_TEXT_MODEL:gpt-6-luna}
    draft: ${OPENAI_TEXT_MODEL:gpt-6-luna}
    image: ${OPENAI_IMAGE_MODEL:gpt-image-2.5-flare}
  max-output-tokens:
    draft: 600
  reasoning-effort:
    extract: none
    chat: none
    draft: none
  image:
    size: 1024x1024
    quality: low
